<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KindCrafted AI Clip Editor</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial;background:#07101f;color:#fff;min-height:100vh;display:grid;place-items:center}.card{width:min(720px,92%);background:#101c31;border:1px solid #263754;border-radius:24px;padding:34px;box-shadow:0 25px 80px #0008}h1{margin:0 0 8px;font-size:34px}p{color:#afbdd3;line-height:1.5}.grid{display:grid;gap:18px;margin:28px 0}label{background:#0a1528;padding:18px;border-radius:16px;border:1px solid #263754;font-weight:700}input{display:block;margin-top:12px;width:100%}button{width:100%;border:0;border-radius:14px;padding:16px;font-weight:800;font-size:17px;background:#4bb7ff;color:#04111d;cursor:pointer}button:disabled{opacity:.5}.status{margin-top:18px;white-space:pre-wrap;color:#cbd7e8}a{color:#65c6ff}</style></head><body><main class="card"><h1>KindCrafted AI Clip Editor</h1><p>Upload your clip and background music. Version 1 automatically makes a 9:16 MP4, loops/trims the music to fit, keeps it low beneath your original audio, and fades the music at the ending.</p><form id="f"><div class="grid"><label>🎬 Video clip<input required name="video" type="file" accept="video/*"></label><label>🎵 Background music<input required name="music" type="file" accept="audio/*"></label></div><button id="b">Edit My Clip</button></form><div class="status" id="s"></div></main><script>const f=document.querySelector('#f'),b=document.querySelector('#b'),s=document.querySelector('#s');f.onsubmit=async e=>{e.preventDefault();b.disabled=true;s.textContent='Editing… This can take a few minutes.';try{const r=await fetch('/api/edit',{method:'POST',body:new FormData(f)}),j=await r.json();if(!r.ok)throw Error(j.error);s.innerHTML=`Done! 🎉 <a href="${j.url}" download>Download edited MP4</a>`}catch(x){s.textContent='Error: '+x.message}finally{b.disabled=false}};</script></body></html>
